name: TeleArk CI/CD
run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('CI {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      package_preview:
        description: Build packages without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: teleark-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: 1 · LF, legal and Linux quality
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check LF line endings and portable scripts
        shell: pwsh
        run: ./scripts/check-line-endings.ps1

      - name: Test line-ending policy
        shell: pwsh
        run: ./scripts/test-line-endings.ps1

      - name: Test distribution credential validation
        shell: pwsh
        run: ./scripts/test-distribution-credentials.ps1

      - name: Test universal macOS dependency check
        shell: bash
        run: bash scripts/test-macos-libraries.sh

      - name: Test Linux package payload checks
        shell: bash
        run: bash scripts/test-linux-payloads.sh

      - name: Configure Rust
        run: rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev

      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: quality-linux

      - name: Report cache
        shell: bash
        run: |
          echo '### Rust cache · Linux quality' >> "$GITHUB_STEP_SUMMARY"
          echo '| Runner | Exact cache hit |' >> "$GITHUB_STEP_SUMMARY"
          echo '| :--- | :--- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| ubuntu-22.04 | ${{ steps.rust-cache.outputs.cache-hit == 'true' }} |' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify legal baseline
        run: |
          set -euo pipefail
          test -s LICENSE-MIT
          test -s LICENSE-APACHE
          test -s THIRD_PARTY_NOTICES.md
          if grep -Eq '^name = "(ztracing|ztracing_macro|zlog)"$' Cargo.lock; then
            echo 'Prohibited GUI dependency from ADR 0007.' >&2
            exit 1
          fi

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Audit dependency licenses and advisories
        run: cargo deny --locked check

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

      - name: Prove Core is frontend-independent
        run: cargo test -p teleark-core --locked

      - name: Validate localization package
        run: cargo test -p teleark-i18n --locked

      - name: Validate workspace documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  test:
    name: 2 · Test (${{ matrix.name }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.package_preview != true }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-2022, target: x86_64-pc-windows-msvc }
          - { name: macOS arm64, os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check LF line endings and portable scripts
        shell: pwsh
        run: ./scripts/check-line-endings.ps1

      - name: Configure Rust
        run: rustup default stable

      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.target }}

      - name: Report cache
        shell: bash
        run: |
          echo '### Rust cache · ${{ matrix.name }} tests' >> "$GITHUB_STEP_SUMMARY"
          echo '| Target | Exact cache hit |' >> "$GITHUB_STEP_SUMMARY"
          echo '| :--- | :--- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| `${{ matrix.target }}` | ${{ steps.rust-cache.outputs.cache-hit == 'true' }} |' >> "$GITHUB_STEP_SUMMARY"

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

      - name: Prove Core is frontend-independent
        run: cargo test -p teleark-core --locked

      - name: Validate localization package
        run: cargo test -p teleark-i18n --locked

  version:
    name: 2 · Validate package version
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.package_preview == true }}
    needs: quality
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      label: ${{ steps.resolve.outputs.label }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure Rust
        run: rustup default stable
      - name: Match tag to Cargo version
        id: resolve
        shell: pwsh
        run: ./scripts/release-version.ps1
      - name: Validate Telegram distribution configuration
        shell: pwsh
        env:
          TELEARK_DISTRIBUTION_TELEGRAM_API_ID: ${{ secrets.TELEARK_DISTRIBUTION_TELEGRAM_API_ID }}
          TELEARK_DISTRIBUTION_TELEGRAM_API_HASH: ${{ secrets.TELEARK_DISTRIBUTION_TELEGRAM_API_HASH }}
        run: ./scripts/check-distribution-credentials.ps1
      - name: Validate persistent macOS signing identity
        shell: bash
        env:
          TELEARK_MACOS_SIGNING_P12_BASE64: ${{ secrets.TELEARK_MACOS_SIGNING_P12_BASE64 }}
        run: bash scripts/check-macos-signing.sh

  package:
    name: 3 · Package (${{ matrix.name }})
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.package_preview == true }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-2022, platform: windows, target: x86_64-pc-windows-msvc, arch: x86_64, artifact: windows-x86_64 }
          - { name: macOS universal, os: macos-15, platform: macos, target: aarch64-apple-darwin, arch: universal, artifact: macos-universal }
          - { name: Linux x64, os: ubuntu-22.04, platform: linux, target: x86_64-unknown-linux-gnu, arch: x86_64, artifact: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure Rust targets
        shell: bash
        run: |
          rustup default stable
          rustup target add '${{ matrix.target }}'
          if [ '${{ matrix.platform }}' = macos ]; then rustup target add x86_64-apple-darwin; fi

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev dpkg-dev

      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.artifact }}

      - name: Report cache
        shell: bash
        run: |
          echo '### Rust cache · ${{ matrix.name }} package' >> "$GITHUB_STEP_SUMMARY"
          echo '| Target | Exact cache hit |' >> "$GITHUB_STEP_SUMMARY"
          echo '| :--- | :--- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| `${{ matrix.target }}` | ${{ steps.rust-cache.outputs.cache-hit == 'true' }} |' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure OpenSSL 3 for macOS signing
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb --version 2.11.1 --locked
          tool="$RUNNER_TEMP/linuxdeploy-${{ matrix.arch }}.AppImage"
          curl -fsSL 'https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${{ matrix.arch }}.AppImage' -o "$tool"
          expected=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          echo "$expected  $tool" | sha256sum -c -
          chmod +x "$tool"
          echo "LINUXDEPLOY=$tool" >> "$GITHUB_ENV"

      - name: Build Windows release with static CRT
        if: matrix.platform == 'windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          TELEARK_DISTRIBUTION_TELEGRAM_API_ID: ${{ secrets.TELEARK_DISTRIBUTION_TELEGRAM_API_ID }}
          TELEARK_DISTRIBUTION_TELEGRAM_API_HASH: ${{ secrets.TELEARK_DISTRIBUTION_TELEGRAM_API_HASH }}
        run: cargo build -p teleark-gui --bin teleark --release --locked --target ${{ matrix.target }}

      - name: Build universal macOS release
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          TELEARK_DISTRIBUTION_TELEGRAM_API_ID: ${{ secrets.TELEARK_DISTRIBUTION_TELEGRAM_API_ID }}
          TELEARK_DISTRIBUTION_TELEGRAM_API_HASH: ${{ secrets.TELEARK_DISTRIBUTION_TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          cargo build -p teleark-gui --bin teleark --release --locked --target aarch64-apple-darwin
          cargo build -p teleark-gui --bin teleark --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/aarch64-apple-darwin/release/teleark target/x86_64-apple-darwin/release/teleark \
            -output target/universal-apple-darwin/release/teleark

      - name: Build Linux release
        if: matrix.platform == 'linux'
        env:
          TELEARK_DISTRIBUTION_TELEGRAM_API_ID: ${{ secrets.TELEARK_DISTRIBUTION_TELEGRAM_API_ID }}
          TELEARK_DISTRIBUTION_TELEGRAM_API_HASH: ${{ secrets.TELEARK_DISTRIBUTION_TELEGRAM_API_HASH }}
        run: cargo build -p teleark-gui --bin teleark --release --locked --target ${{ matrix.target }}

      - name: Configure Windows packaging SDK
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore pinned MSI compiler
        if: matrix.platform == 'windows'
        run: dotnet tool restore

      - name: Install Inno Setup wizard compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup --version=6.7.3 --yes --no-progress --allow-downgrade

      - name: Package Windows executable, ZIP and EXE setup wizard
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 "target/${{ matrix.target }}/release/teleark.exe" dist `
            '${{ needs.version.outputs.version }}' '${{ needs.version.outputs.label }}' '${{ matrix.arch }}'

      - name: Verify Windows artifacts, setup wizard and upgrade transactions
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/verify-release-windows.ps1 '${{ needs.version.outputs.version }}' `
            '${{ needs.version.outputs.label }}' '${{ matrix.arch }}'

      - name: Retain failed Windows installer logs
        if: ${{ failure() && matrix.platform == 'windows' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installer-test-logs
          path: |
            ${{ runner.temp }}/teleark-msi-*/*.log
            ${{ runner.temp }}/teleark-exe-*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package and verify macOS release
        if: matrix.platform == 'macos'
        env:
          TELEARK_MACOS_SIGNING_P12_BASE64: ${{ secrets.TELEARK_MACOS_SIGNING_P12_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-macos-signing.sh
          bash scripts/macos/verify-keychain-signing.sh
          label='${{ needs.version.outputs.label }}'
          base="teleark-${label}-macos-universal"
          mkdir -p "dist/$base"
          scripts/package-macos.sh target/universal-apple-darwin/release/teleark "dist/$base/TeleArk.app" dist \
            '${{ needs.version.outputs.version }}' "$label" universal
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "dist/$base/"
          tar -C dist -czf "dist/$base.tar.gz" "$base"
          (cd dist && shasum -a 256 "$base.bin" "$base.tar.gz" "TeleArk-${label}-macos-universal.pkg" > SHA256SUMS)
          bash scripts/verify-release-macos.sh '${{ needs.version.outputs.version }}' "$label"

      - name: Package Linux release
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-linux.sh "target/${{ matrix.target }}/release/teleark" dist \
            '${{ needs.version.outputs.version }}' '${{ needs.version.outputs.label }}' '${{ matrix.target }}'

      - name: Verify Linux package contents and installer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-linux.sh '${{ needs.version.outputs.version }}' '${{ needs.version.outputs.label }}'

      - name: Report package assets
        shell: bash
        run: |
          echo '### Verified package assets · ${{ matrix.name }}' >> "$GITHUB_STEP_SUMMARY"
          echo '| SHA256 | File |' >> "$GITHUB_STEP_SUMMARY"
          echo '| :--- | :--- |' >> "$GITHUB_STEP_SUMMARY"
          while read -r hash file; do echo "| \`$hash\` | \`$file\` |" >> "$GITHUB_STEP_SUMMARY"; done < dist/SHA256SUMS

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.pkg
            dist/*.bin
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 4 · Publish GitHub Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [version, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Verify exact asset set and create checksums
        shell: bash
        run: |
          set -euo pipefail
          label='${{ needs.version.outputs.label }}'
          mkdir -p dist
          copy_asset() {
            local group="$1" name="$2"
            test -s "artifacts/release-$group/$name"
            cp "artifacts/release-$group/$name" "dist/$name"
          }
          copy_asset windows-x86_64 "teleark-${label}-windows-x86_64.exe"
          copy_asset windows-x86_64 "teleark-${label}-windows-x86_64.zip"
          copy_asset windows-x86_64 "TeleArk-Setup-${label}-windows-x86_64.exe"
          copy_asset macos-universal "teleark-${label}-macos-universal.bin"
          copy_asset macos-universal "teleark-${label}-macos-universal.tar.gz"
          copy_asset macos-universal "TeleArk-${label}-macos-universal.pkg"
          copy_asset linux-x86_64 "teleark-${label}-linux-x86_64.AppImage"
          copy_asset linux-x86_64 "teleark-${label}-linux-x86_64.tar.gz"
          copy_asset linux-x86_64 "teleark_${label}_amd64.deb"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 9
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum * > SHA256SUMS)
          echo '### Release assets' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated nine installers and portable assets across Windows x64, macOS universal, and Linux x64.' >> "$GITHUB_STEP_SUMMARY"
          echo '| SHA256 | File |' >> "$GITHUB_STEP_SUMMARY"
          echo '| :--- | :--- |' >> "$GITHUB_STEP_SUMMARY"
          while read -r hash file; do echo "| \`$hash\` | \`$file\` |" >> "$GITHUB_STEP_SUMMARY"; done < dist/SHA256SUMS

      - name: Create tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "TeleArk $GITHUB_REF_NAME"

  summary:
    name: Stage summary
    if: ${{ always() }}
    needs: [quality, test, version, package, publish]
    runs-on: ubuntu-22.04
    steps:
      - name: Report stages
        shell: bash
        run: |
          echo '# TeleArk CI/CD stages' >> "$GITHUB_STEP_SUMMARY"
          echo '| Stage | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '| :--- | :--- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| LF, legal, Linux quality | ${{ needs.quality.result }} |' >> "$GITHUB_STEP_SUMMARY"
          if [[ '${{ github.ref }}' == refs/tags/v* ]] || [ '${{ inputs.package_preview }}' = 'true' ]; then
            echo '| Version and Telegram configuration | ${{ needs.version.result }} |' >> "$GITHUB_STEP_SUMMARY"
            echo '| Native packages | ${{ needs.package.result }} |' >> "$GITHUB_STEP_SUMMARY"
            echo '| GitHub Release | ${{ needs.publish.result }} |' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '| Windows and macOS tests | ${{ needs.test.result }} |' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'LF counts and violations, exact Rust cache hits, and package checksums are shown in the individual job summaries above.' >> "$GITHUB_STEP_SUMMARY"
