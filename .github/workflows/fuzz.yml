name: Scheduled format fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [part_decode, manifest_decode]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install fuzzing driver
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # The repository pins stable; installing nightly does not override that file.
      - name: Run bounded parser campaign with nightly
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time=600 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
