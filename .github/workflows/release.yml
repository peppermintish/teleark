name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Resolve release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure Rust toolchain
        run: rustup default stable

      - name: Validate tag and resolve artifact label
        id: version
        shell: pwsh
        run: ./scripts/release-version.ps1

  verify-legal-and-policy:
    name: Verify legal baseline and dependency policies
    needs: verify-version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure Rust toolchain
        run: |
          rustup default stable
          rustup component add clippy rustfmt

      - name: Cache Rust build data (Policy Linux)
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-policy-linux-x86_64

      - name: Report cache status (Policy Linux)
        shell: bash
        run: |
          hit="${{ steps.rust-cache.outputs.cache-hit }}"
          echo "### ⚡ Cache Status — Release Policy Check (Linux)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$hit" = "true" ]; then
            echo "| **Cache Status** | 🟢 **HIT (Exact)** |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Cache Status [Release Policy]::🟢 Rust cache HIT"
          else
            echo "| **Cache Status** | ⚠️ **MISS** |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Cache Status [Release Policy]::⚠️ Rust cache MISS"
          fi
          echo "| **Runner Image** | \`ubuntu-22.04\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify repository legal baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE-MIT
          test -s LICENSE-APACHE
          test -s THIRD_PARTY_NOTICES.md
          if grep -Eq '^name = "(ztracing|ztracing_macro|zlog)"$' Cargo.lock; then
            echo "The locked graph contains a GUI dependency prohibited by ADR 0007." >&2
            exit 1
          fi

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Audit dependency licenses and advisories
        run: cargo deny --locked check

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Validate workspace documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  package-matrix:
    name: Build & package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            artifact-name: release-macos
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            artifact-name: release-windows
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            artifact-name: release-linux
    needs: verify-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure Rust toolchain
        run: |
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            dpkg-dev

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: |
          if ! command -v cargo-deb >/dev/null 2>&1; then
            cargo install cargo-deb --version 2.11.1 --locked
          fi

      - name: Cache Rust build data (${{ matrix.name }})
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-pkg-${{ matrix.target }}

      - name: Report cache status (${{ matrix.name }})
        shell: bash
        run: |
          hit="${{ steps.rust-cache.outputs.cache-hit }}"
          echo "### ⚡ Cache Status — ${{ matrix.name }} Packaging (\`${{ matrix.target }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$hit" = "true" ]; then
            echo "| **Cache Status** | 🟢 **HIT (Exact)** |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Cache Status [${{ matrix.name }} Packaging]::🟢 Rust cache HIT (${{ matrix.target }})"
          else
            echo "| **Cache Status** | ⚠️ **MISS** |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Cache Status [${{ matrix.name }} Packaging]::⚠️ Rust cache MISS (${{ matrix.target }})"
          fi
          echo "| **Runner OS** | \`${{ runner.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Runner Image** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Windows release (+crt-static)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build -p teleark-gui --bin teleark --release --locked --target ${{ matrix.target }}

      - name: Build macOS release
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build -p teleark-gui --bin teleark --release --locked --target ${{ matrix.target }}

      - name: Build Linux release
        if: runner.os == 'Linux'
        run: cargo build -p teleark-gui --bin teleark --release --locked --target ${{ matrix.target }}

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 `
            "target\${{ matrix.target }}\release\teleark.exe" dist `
            "${{ needs.verify-version.outputs.version }}" `
            "${{ needs.verify-version.outputs.label }}"

      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify-version.outputs.version }}"
          label="${{ needs.verify-version.outputs.label }}"
          architecture="${{ matrix.arch }}"
          package="teleark-${label}-macos-${architecture}"
          mkdir -p "dist/${package}"
          scripts/package-macos.sh "target/${{ matrix.target }}/release/teleark" "dist/${package}/TeleArk.app" dist "$version" "$label" "$architecture"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (
            cd dist
            for f in "teleark-${label}-macos-${architecture}.bin" "${package}.tar.gz" "TeleArk-${label}-macos-${architecture}.pkg"; do
              test -s "$f"
              shasum -a 256 "$f" >> SHA256SUMS
            done
          )

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/package-linux.sh "target/${{ matrix.target }}/release/teleark" dist \
            "${{ needs.verify-version.outputs.version }}" \
            "${{ needs.verify-version.outputs.label }}" \
            "${{ matrix.target }}"

      - name: Verify Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $label = "${{ needs.verify-version.outputs.label }}"
          $base = "teleark-$label-windows-x86_64"
          $setup = "TeleArk-Setup-$label-windows-x86_64.exe"
          foreach ($name in @("$base.exe", "$base.zip", $setup, 'SHA256SUMS')) {
            $path = Join-Path dist $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Missing or empty release artifact: $path"
            }
          }
          $unpacked = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          Expand-Archive -LiteralPath "dist/$base.zip" -DestinationPath $unpacked
          foreach ($name in @('teleark.exe', 'LICENSE-MIT', 'LICENSE-APACHE', 'THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $unpacked $name) -PathType Leaf)) {
              throw "Portable archive is missing $name"
            }
          }
          if ((Get-FileHash -Algorithm SHA256 "dist/$base.exe").Hash -ne (Get-FileHash -Algorithm SHA256 (Join-Path $unpacked 'teleark.exe')).Hash) {
            throw 'Standalone and portable Windows executables differ.'
          }
          if ((Get-Item "dist/$setup").VersionInfo.ProductVersion.Trim() -ne "${{ needs.verify-version.outputs.version }}") {
            throw 'Windows installer metadata does not match the application version.'
          }
          $lines = @(Get-Content dist/SHA256SUMS)
          if ($lines.Count -ne 3) { throw 'Windows checksum manifest does not list exactly three artifacts.' }
          foreach ($line in $lines) {
            $parts = $line -split '\s+', 2
            $path = Join-Path dist $parts[1]
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-FileHash -Algorithm SHA256 $path).Hash -ine $parts[0]) {
              throw "Windows checksum verification failed for $path"
            }
          }

      - name: Exercise Windows in-place upgrade and downgrade refusal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.verify-version.outputs.version }}"
          $label = "${{ needs.verify-version.outputs.label }}"
          $setup = (Resolve-Path "dist/TeleArk-Setup-$label-windows-x86_64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "teleark-install-$([guid]::NewGuid().ToString('N'))"
          $registry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{9A67D26D-7281-4FE9-B942-D6D2A8719DF5}_is1'
          $runSetup = {
            param($logName)
            $log = Join-Path $env:RUNNER_TEMP $logName
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"", "/LOG=`"$log`"")
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
            return @{ ExitCode = $process.ExitCode; Log = $log }
          }
          try {
            $first = & $runSetup 'teleark-first-install.log'
            if ($first.ExitCode -ne 0) { throw "First Windows installation failed: $($first.ExitCode)" }
            $installed = Join-Path $installDir 'teleark.exe'
            if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw 'Windows installer did not install the executable.' }
            if (-not (Test-Path -LiteralPath $registry)) { throw 'Windows installer did not register the application.' }

            Set-ItemProperty -LiteralPath $registry -Name DisplayVersion -Value '0.0.1'
            $marker = Join-Path $installDir 'preserve-marker.txt'
            [System.IO.File]::WriteAllText($marker, 'preserve')
            $upgrade = & $runSetup 'teleark-upgrade.log'
            if ($upgrade.ExitCode -ne 0) { throw "Windows in-place upgrade failed: $($upgrade.ExitCode)" }
            if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw 'Windows upgrade removed an unrelated installed file.' }
            if ((Get-ItemProperty -LiteralPath $registry -Name DisplayVersion).DisplayVersion -ne $version) {
              throw 'Windows upgrade did not update the registered version.'
            }
            if ((Get-FileHash -Algorithm SHA256 $installed).Hash -ne (Get-FileHash -Algorithm SHA256 "dist/teleark-$label-windows-x86_64.exe").Hash) {
              throw 'Windows upgrade did not put the release executable in place.'
            }

            Set-ItemProperty -LiteralPath $registry -Name DisplayVersion -Value '99.0.0'
            $before = (Get-FileHash -Algorithm SHA256 $installed).Hash
            $downgrade = & $runSetup 'teleark-downgrade.log'
            if ($downgrade.ExitCode -eq 0) { throw 'Windows installer accepted a downgrade.' }
            if ((Get-FileHash -Algorithm SHA256 $installed).Hash -ne $before) { throw 'Windows downgrade changed the installed executable.' }
            if (-not (Select-String -LiteralPath $downgrade.Log -Pattern 'Downgrading is not permitted' -Quiet)) {
              throw 'Windows downgrade log is missing the refusal notification.'
            }
          } finally {
            if (Test-Path -LiteralPath $registry) { Set-ItemProperty -LiteralPath $registry -Name DisplayVersion -Value $version }
            $uninstaller = Join-Path $installDir 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -Wait | Out-Null
            }
          }

      - name: Verify macOS release artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          label="${{ needs.verify-version.outputs.label }}"
          version="${{ needs.verify-version.outputs.version }}"
          arch="${{ matrix.arch }}"
          base="teleark-${label}-macos-${arch}"
          for path in "dist/${base}.bin" "dist/${base}.tar.gz" "dist/TeleArk-${label}-macos-${arch}.pkg" dist/SHA256SUMS; do test -s "$path"; done
          lipo -archs "dist/${base}.bin" | tr ' ' '\n' | grep -Fxq "$arch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "dist/${base}/TeleArk.app/Contents/Info.plist")" = "$version"
          tar -tzf "dist/${base}.tar.gz" | grep -F "${base}/TeleArk.app/Contents/MacOS/teleark" >/dev/null
          tar -tzf "dist/${base}.tar.gz" | grep -F "${base}/THIRD_PARTY_NOTICES.md" >/dev/null
          expanded="$(mktemp -d -t teleark-expand)"
          pkgutil --expand "dist/TeleArk-${label}-macos-${arch}.pkg" "$expanded/product"
          grep -Fq "version=\"${version}\"" "$expanded/product/Distribution"
          grep -Fq 'checkTeleArkVersion()' "$expanded/product/Distribution"
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Exercise macOS in-place upgrade and downgrade refusal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify-version.outputs.version }}"
          label="${{ needs.verify-version.outputs.label }}"
          app=/Applications/TeleArk.app
          test ! -e "$app"
          trap 'sudo rm -rf /Applications/TeleArk.app' EXIT
          sudo mkdir -p "$app/Contents"
          sudo cp "dist/teleark-${label}-macos-arm64/TeleArk.app/Contents/Info.plist" "$app/Contents/Info.plist"
          sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.0.1' "$app/Contents/Info.plist"
          pkg="dist/TeleArk-${label}-macos-arm64.pkg"
          sudo installer -pkg "$pkg" -target /
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          cmp "$app/Contents/MacOS/teleark" "dist/teleark-${label}-macos-arm64.bin"
          sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 99.0.0' "$app/Contents/Info.plist"
          before="$(shasum -a 256 "$app/Contents/MacOS/teleark" | cut -d ' ' -f 1)"
          if sudo installer -pkg "$pkg" -target / >"$RUNNER_TEMP/teleark-downgrade.log" 2>&1; then
            echo 'macOS installer accepted a downgrade.' >&2
            exit 1
          fi
          grep -Fq 'Downgrading is not permitted' "$RUNNER_TEMP/teleark-downgrade.log"
          test "$(shasum -a 256 "$app/Contents/MacOS/teleark" | cut -d ' ' -f 1)" = "$before"

      - name: Verify Linux release artifacts and downgrade guard
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          label="${{ needs.verify-version.outputs.label }}"
          version="${{ needs.verify-version.outputs.version }}"
          base="teleark-${label}-linux-x86_64"
          deb="dist/teleark_${label}_amd64.deb"
          for path in "dist/${base}" "dist/${base}.tar.gz" "$deb" dist/SHA256SUMS; do test -s "$path"; done
          file "dist/${base}" | grep -F 'ELF 64-bit' >/dev/null
          tar -tzf "dist/${base}.tar.gz" | grep -F "${base}/THIRD_PARTY_NOTICES.md" >/dev/null
          test "$(dpkg-deb -f "$deb" Package)" = teleark
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          package_version="$(dpkg-deb -f "$deb" Version)"
          case "$package_version" in "$version"|"$version"-*) ;; *) echo "Unexpected Debian version: $package_version" >&2; exit 1;; esac
          control="$(mktemp -d)"
          dpkg-deb -e "$deb" "$control"
          dpkg-deb -x "$deb" "$control/payload"
          cmp "dist/${base}" "$control/payload/usr/bin/teleark"
          test -x "$control/preinst"
          if "$control/preinst" upgrade "${package_version}+newer" "$package_version" >"$control/out" 2>&1; then
            echo 'Debian preinst accepted a downgrade.' >&2
            exit 1
          fi
          grep -Fq 'Downgrading is not permitted' "$control/out"
          "$control/preinst" upgrade 0.0.0 "$package_version"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.pkg
            dist/teleark-*-linux-x86_64
            dist/*.bin
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify-version, verify-legal-and-policy, package-matrix]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository for release notices
        uses: actions/checkout@v7.0.1

      - name: Download all release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Consolidate packages and generate unified checksums
        shell: bash
        run: |
          set -euo pipefail
          label="${{ needs.verify-version.outputs.label }}"
          mkdir -p dist
          files=(
            "teleark-${label}-windows-x86_64.exe"
            "teleark-${label}-windows-x86_64.zip"
            "TeleArk-Setup-${label}-windows-x86_64.exe"
            "teleark-${label}-macos-arm64.bin"
            "teleark-${label}-macos-arm64.tar.gz"
            "TeleArk-${label}-macos-arm64.pkg"
            "teleark-${label}-linux-x86_64"
            "teleark-${label}-linux-x86_64.tar.gz"
            "teleark_${label}_amd64.deb"
          )
          for file in "${files[@]}"; do
            case "$file" in
              *windows*) source="artifacts/release-windows/$file" ;;
              *macos*) source="artifacts/release-macos/$file" ;;
              *linux*|*.deb) source="artifacts/release-linux/$file" ;;
            esac
            test -s "$source"
            cp "$source" "dist/$file"
          done
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          cd dist
          sha256sum "${files[@]}" LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md > SHA256SUMS
          echo "### 📦 Unified Release Package Manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | SHA256 Checksum |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          while read -r hash name; do
            echo "| \`$name\` | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done < SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "TeleArk ${GITHUB_REF_NAME}"
