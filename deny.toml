# Proxy-feature dependencies retain the existing permissive license policy; no new exception.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys@0.2.5" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
    { allow = ["MPL-2.0"], crate = "cbindgen@0.28.0" },
    { allow = ["MPL-2.0"], crate = "dwrote@0.11.5" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { crate = "zlog", reason = "GPL tracing graph prohibited by ADR 0007" },
    { crate = "ztracing", reason = "GPL tracing graph prohibited by ADR 0007" },
    { crate = "ztracing_macro", reason = "GPL tracing graph prohibited by ADR 0007" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
