[package]
name = "teleark-runtime"
description = "Frontend-neutral desktop composition and worker ownership for TeleArk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
teleark-core.workspace = true
teleark-crypto = { version = "=0.1.1", path = "../teleark-crypto" }
teleark-storage = { version = "=0.1.1", path = "../teleark-storage" }
teleark-telegram = { version = "=0.1.1", path = "../teleark-telegram" }
teleark-transfer = { version = "=0.1.1", path = "../teleark-transfer" }
tokio = { version = "1.52.3", default-features = false, features = ["rt", "sync"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
