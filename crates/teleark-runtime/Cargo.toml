[package]
name = "teleark-runtime"
description = "Frontend-neutral desktop composition and worker ownership for TeleArk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
teleark-core.workspace = true
teleark-crypto = { version = "=0.5.6", path = "../teleark-crypto" }
teleark-storage = { version = "=0.5.6", path = "../teleark-storage" }
teleark-telegram = { version = "=0.5.6", path = "../teleark-telegram" }
teleark-transfer = { version = "=0.5.6", path = "../teleark-transfer" }
blake3 = "=1.8.7"
notify = "=7.0.0"
tokio = { version = "1.52.3", default-features = false, features = ["rt", "sync", "time"] }
tracing.workspace = true
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }
sysinfo = { version = "=0.31.4", default-features = false, features = ["disk"] }
zeroize = { version = "1.8.2", features = ["derive"] }

serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
