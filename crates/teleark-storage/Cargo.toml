[package]
name = "teleark-storage"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/teleark/teleark"
rust-version = "1.88"
description = "SQLite persistence adapter for TeleArk"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
teleark-core = { version = "=0.3.0", path = "../teleark-core" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
