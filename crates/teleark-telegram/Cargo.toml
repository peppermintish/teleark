[package]
name = "teleark-telegram"
description = "Telegram transport adapter for TeleArk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.4.3"
grammers-client = "=0.10.0"
grammers-mtsender = { version = "=0.10.0", features = ["proxy"] }
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
tempfile = "3.20.0"

[lints]
workspace = true
