[package]
name = "teleark-transfer"
version = "0.4.5"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Frontend-neutral deterministic transfer scheduling and workers for TeleArk"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
teleark-core = { version = "=0.4.5", path = "../teleark-core" }
blake3 = "=1.8.7"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
